services:
  - type: web
    name: careersafe-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: "5000"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://careersafe.onrender.com"
    healthCheckPath: /health
